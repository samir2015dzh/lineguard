[workspace]
members = ["crates/core", "crates/agent", "crates/ui"]
resolver = "2"

[workspace.package]
version = "0.3.0-preview.4"
edition = "2024"
rust-version = "1.95"
license = "LicenseRef-Proprietary"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
