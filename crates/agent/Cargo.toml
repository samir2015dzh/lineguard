windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Memory", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_Threading", "Win32_System_RemoteDesktop", "Win32_System_Environment", "Win32_UI_Shell", "Win32_System_Com", "Win32_NetworkManagement_WindowsFilteringPlatform", "Win32_System_Rpc", "Win32_System_JobObjects", "Win32_System_SystemInformation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_Properties", "Win32_System_Registry", "Win32_System_SystemServices"] }
